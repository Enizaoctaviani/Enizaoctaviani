<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="100%" height="auto" role="img" aria-label="Cover pink bertema mahasiswa Teknologi Informasi dan coding">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffeaf7"/>
      <stop offset="0.55" stop-color="#ffc4e5"/>
      <stop offset="1" stop-color="#ff9bd4"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd9ee"/>
      <stop offset="0.5" stop-color="#ffb3de"/>
      <stop offset="1" stop-color="#ff9ad4"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c0621"/>
      <stop offset="1" stop-color="#180211"/>
    </linearGradient>
    <linearGradient id="standGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d62ba9"/>
      <stop offset="1" stop-color="#9c187d"/>
    </linearGradient>
    <pattern id="dotGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.7" fill="#ffffff" opacity="0.42"/>
    </pattern>
    <filter id="softShadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#a51c86" flood-opacity="0.26"/>
    </filter>
    <filter id="terminalShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#7a1562" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="460" rx="26" fill="url(#bgGrad)"/>
  <rect width="900" height="460" rx="26" fill="url(#dotGrid)"/>
  <circle cx="844" cy="36" r="168" fill="#ffffff" opacity="0.2"/>
  <circle cx="52" cy="442" r="138" fill="#c2189a" opacity="0.12"/>
  <circle cx="812" cy="392" r="52" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.35" stroke-dasharray="4 7"/>
  <text x="430" y="72" font-family="'Fira Code','Consolas',monospace" font-size="24" font-weight="700" fill="#ffffff" opacity="0.5" transform="rotate(8 430 72)">{ }</text>
  <text x="812" y="440" font-family="'Fira Code','Consolas',monospace" font-size="38" font-weight="700" fill="#ffffff" opacity="0.28">&lt; / &gt;</text>

  <!-- Identitas -->
  <rect x="56" y="46" width="302" height="32" rx="16" fill="#4a0b35"/>
  <text x="207" y="67" text-anchor="middle" font-family="'Fira Code','Consolas',monospace" font-size="11.5" font-weight="700" letter-spacing="1.7" fill="#ffd1ea">🎓 MAHASISWA TEKNOLOGI INFORMASI</text>

  <text x="54" y="142" font-family="'Segoe UI','Trebuchet MS',sans-serif" font-size="44" font-weight="800" letter-spacing="-1" fill="#3d082d">Eniza Octaviani</text>
  <text x="56" y="174" font-family="'Segoe UI','Trebuchet MS',sans-serif" font-size="15" font-weight="600" fill="#6d1c50">Coding • Web Development • Software Engineering</text>
  <text x="56" y="198" font-family="'Segoe UI','Trebuchet MS',sans-serif" font-size="13" font-style="italic" fill="#7d285f">"Pink Life pink person" — belajar, bikin proyek, push ke GitHub.</text>

  <!-- Terminal mini -->
  <rect x="56" y="222" width="400" height="160" rx="16" fill="#350627" stroke="#ff7acf" stroke-width="1.5" filter="url(#terminalShadow)"/>
  <rect x="56" y="222" width="400" height="34" rx="16" fill="#470b36"/>
  <rect x="56" y="240" width="400" height="16" fill="#470b36"/>
  <line x1="56" y1="256" x2="456" y2="256" stroke="#67124f" stroke-width="1"/>
  <circle cx="78" cy="239" r="4" fill="#ff70dc"/>
  <circle cx="92" cy="239" r="4" fill="#ffb3e6"/>
  <circle cx="106" cy="239" r="4" fill="#ffd1ea"/>
  <text x="256" y="243" text-anchor="middle" font-family="'Fira Code','Consolas',monospace" font-size="10.5" fill="#ffd1ea">eniza@kampus: ~/coding</text>

  <g font-family="'Fira Code','Consolas',monospace" font-size="11.5">
    <text x="78" y="280" fill="#8be9fd">$</text>
    <text x="94" y="280" fill="#ffffff">whoami</text>
    <text x="78" y="304" fill="#ff8ad8">eniza — mahasiswa Teknologi Informasi</text>
    <text x="78" y="328" fill="#8be9fd">$</text>
    <text x="94" y="328" fill="#ffffff">cat fokus.txt</text>
    <text x="78" y="352" fill="#fbcfe8">web dev · basis data · OOP · clean code</text>
    <text x="78" y="376" fill="#8be9fd">$</text>
    <text x="94" y="376" fill="#ffffff">git commit -m "belajar &amp; ngoding"</text>
  </g>

  <!-- Tag teknologi -->
  <g font-family="'Fira Code','Consolas',monospace" font-size="11" font-weight="700" fill="#4a0b35">
    <rect x="56" y="400" width="96" height="30" rx="15" fill="#ffffff" fill-opacity="0.9" stroke="#eb34bd" stroke-width="1.2"/>
    <text x="104" y="419" text-anchor="middle">JavaScript</text>
    <rect x="160" y="400" width="70" height="30" rx="15" fill="#ffffff" fill-opacity="0.9" stroke="#eb34bd" stroke-width="1.2"/>
    <text x="195" y="419" text-anchor="middle">React</text>
    <rect x="238" y="400" width="76" height="30" rx="15" fill="#ffffff" fill-opacity="0.9" stroke="#eb34bd" stroke-width="1.2"/>
    <text x="276" y="419" text-anchor="middle">MySQL</text>
    <rect x="322" y="400" width="58" height="30" rx="15" fill="#ffffff" fill-opacity="0.9" stroke="#eb34bd" stroke-width="1.2"/>
    <text x="351" y="419" text-anchor="middle">Git</text>
  </g>

  <!-- Panel meja belajar -->
  <rect x="466" y="40" width="392" height="384" rx="28" fill="#ffffff" fill-opacity="0.38" stroke="#ffffff" stroke-opacity="0.8"/>

  <!-- Monitor -->
  <g filter="url(#softShadow)">
    <rect x="496" y="54" width="332" height="206" rx="14" fill="#2b0620" stroke="#eb34bd" stroke-width="2.5"/>
  </g>
  <rect x="508" y="70" width="308" height="164" rx="7" fill="url(#screenGrad)"/>
  <rect x="508" y="70" width="308" height="24" rx="7" fill="#33082a"/>
  <rect x="508" y="82" width="308" height="12" fill="#33082a"/>
  <line x1="508" y1="94" x2="816" y2="94" stroke="#5a1247" stroke-width="1"/>
  <circle cx="521" cy="82" r="3" fill="#ff70dc"/>
  <circle cx="532" cy="82" r="3" fill="#ffb3e6"/>
  <circle cx="543" cy="82" r="3" fill="#ffd1ea"/>
  <rect x="560" y="72" width="84" height="18" rx="4" fill="#4b0d3a"/>
  <text x="602" y="84.5" text-anchor="middle" font-family="'Fira Code','Consolas',monospace" font-size="8.5" fill="#ffd1ea">index.ts</text>

  <!-- Isi editor -->
  <g font-family="'Fira Code','Consolas',monospace" font-size="9.8">
    <g fill="#7a2f68" text-anchor="end" font-size="8.5">
      <text x="527" y="112">01</text>
      <text x="527" y="128">02</text>
      <text x="527" y="144">03</text>
      <text x="527" y="160">04</text>
      <text x="527" y="176">05</text>
      <text x="527" y="192">06</text>
      <text x="527" y="208">07</text>
      <text x="527" y="224">08</text>
    </g>
    <text x="536" y="112" fill="#e2c7db"><tspan fill="#eb34bd">import</tspan> { campus } <tspan fill="#eb34bd">from</tspan> <tspan fill="#fbcfe8">"./ti"</tspan>;</text>
    <text x="536" y="144" fill="#e2c7db"><tspan fill="#eb34bd">const</tspan> <tspan fill="#ff8ad8">eniza</tspan> = {</text>
    <text x="546" y="160" fill="#e2c7db">prodi: <tspan fill="#fbcfe8">"Teknologi Informasi"</tspan>,</text>
    <text x="546" y="176" fill="#e2c7db">fokus: [<tspan fill="#fbcfe8">"web"</tspan>, <tspan fill="#fbcfe8">"data"</tspan>, <tspan fill="#fbcfe8">"oop"</tspan>],</text>
    <text x="546" y="192" fill="#e2c7db">status: <tspan fill="#fbcfe8">"belajar &amp; ngoding"</tspan>,</text>
    <text x="536" y="208" fill="#e2c7db">};</text>
    <text x="536" y="224" fill="#e2c7db"><tspan fill="#ff8ad8">eniza</tspan>.buildFuture(<tspan fill="#fbcfe8">"💖"</tspan>);</text>
  </g>
  <circle cx="662" cy="240" r="2" fill="#ff70dc"/>
  <text x="662" y="251" text-anchor="middle" font-family="'Fira Code','Consolas',monospace" font-size="8" letter-spacing="2.4" fill="#ff8ad8">eniza.dev</text>

  <!-- Kaki monitor -->
  <rect x="646" y="260" width="32" height="66" fill="url(#standGrad)"/>
  <rect x="604" y="326" width="116" height="14" rx="7" fill="#b3248f"/>

  <!-- Meja -->
  <rect x="472" y="340" width="380" height="16" rx="8" fill="url(#deskGrad)" stroke="#e05aae" stroke-width="1"/>
  <rect x="496" y="356" width="10" height="54" rx="5" fill="#f3b9da"/>
  <rect x="818" y="356" width="10" height="54" rx="5" fill="#f3b9da"/>
  <ellipse cx="662" cy="416" rx="180" ry="6" fill="#a51c86" opacity="0.12"/>

  <!-- Keyboard -->
  <rect x="540" y="300" width="178" height="42" rx="8" fill="#fff7fc" stroke="#d85cab" stroke-width="1.2"/>
  <g stroke="#f0a5cf" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="7 4">
    <line x1="552" y1="311" x2="706" y2="311"/>
    <line x1="552" y1="321" x2="706" y2="321"/>
    <line x1="552" y1="331" x2="706" y2="331"/>
  </g>
  <line x1="592" y1="340" x2="666" y2="340" stroke="#e88cc5" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Mouse -->
  <ellipse cx="742" cy="326" rx="13" ry="10.5" fill="#fff7fc" stroke="#d85cab" stroke-width="1.2"/>
  <line x1="742" y1="319" x2="742" y2="325" stroke="#e88cc5" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Mug -->
  <path d="M 806 306 q 12 2 12 10 q 0 8 -12 10" fill="none" stroke="#d62ba9" stroke-width="3.5" stroke-linecap="round"/>
  <rect x="764" y="294" width="44" height="42" rx="8" fill="#ff8ad0" stroke="#d62ba9" stroke-width="1.2"/>
  <path d="M 786 310 c -3.6 -5 -11 -2.6 -11 2.2 c 0 4.8 11 10 11 10 c 0 0 11 -5.2 11 -10 c 0 -4.8 -7.4 -7.2 -11 -2.2 z" fill="#ffffff" opacity="0.9"/>
  <path d="M 776 286 q -4 -6 2 -10" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
  <path d="M 789 286 q -4 -6 2 -10" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.75"/>

  <!-- Tanaman -->
  <line x1="842" y1="318" x2="842" y2="288" stroke="#9c187d" stroke-width="2"/>
  <ellipse cx="832" cy="296" rx="11" ry="5" fill="#ff8ad0" transform="rotate(-28 832 296)"/>
  <ellipse cx="852" cy="296" rx="11" ry="5" fill="#ff70dc" transform="rotate(28 852 296)"/>
  <ellipse cx="842" cy="286" rx="6" ry="11" fill="#ffb3e6"/>
  <rect x="828" y="316" width="28" height="24" rx="4" fill="#e05aae" stroke="#b3248f"/>

  <!-- Buku -->
  <rect x="478" y="330" width="54" height="10" rx="3" fill="#b3248f"/>
  <rect x="482" y="320" width="48" height="10" rx="3" fill="#ff70dc"/>
  <rect x="476" y="310" width="56" height="10" rx="3" fill="#e05aae"/>
  <rect x="480" y="300" width="50" height="10" rx="3" fill="#ffb3e6" stroke="#d62ba9" stroke-width="0.8"/>

  <!-- Aksen mengambang -->
  <circle cx="470" cy="50" r="22" fill="#4a0b35" stroke="#ffb3e6" stroke-width="2"/>
  <text x="470" y="57" text-anchor="middle" font-family="'Fira Code','Consolas',monospace" font-size="12" font-weight="700" fill="#ffd1ea">&lt;/&gt;</text>
  <rect x="742" y="24" width="118" height="28" rx="14" fill="#ffffff" stroke="#eb34bd" stroke-width="1.5"/>
  <text x="801" y="42" text-anchor="middle" font-family="'Fira Code','Consolas',monospace" font-size="10" font-weight="700" fill="#4a0b35">npm run dev</text>
  <rect x="828" y="378" width="48" height="28" rx="9" fill="#4a0b35"/>
  <text x="852" y="397" text-anchor="middle" font-family="'Fira Code','Consolas',monospace" font-size="11" font-weight="700" fill="#ffd1ea">{ }</text>

  <text x="630" y="404" text-anchor="middle" font-family="'Fira Code','Consolas',monospace" font-size="10.5" fill="#7d285f" opacity="0.9">// keep learning, keep coding</text>
</svg>
