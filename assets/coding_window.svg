    <text x="100" y="416">
      <tspan class="punctuation">}</tspan> <tspan class="comment">// 🎓 Powered by Eniza Octaviani // Mahasiswa TI</tspan>
    </text>
  </g>

  <!-- Neon Badge Bottom-Right -->
  <g transform="translate(600, 370)">
    <rect x="0" y="0" width="220" height="42" rx="8" fill="#28052d" stroke="#eb34bd" stroke-width="1.5" filter="url(#neonGlow)"/>
    <text x="110" y="26" text-anchor="middle" fill="#ffffff" class="font-code" font-size="12" font-weight="bold" letter-spacing="1">
