    <text x="120" y="390">
      <tspan class="highlight">student</tspan><tspan class="punctuation">.</tspan><tspan class="property">buildSoftware</tspan><tspan class="punctuation">({ </tspan><tspan class="property">theme</tspan><tspan class="punctuation">: </tspan><tspan class="string">"#eb34bd"</tspan><tspan class="punctuation">, </tspan><tspan class="property">code</tspan><tspan class="punctuation">: </tspan><tspan class="string">"Clean &amp; Scalable" </tspan><tspan class="punctuation">});</tspan>
    </text>

