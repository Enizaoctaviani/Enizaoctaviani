<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 440" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140316"/>
      <stop offset="50%" stop-color="#0b010d"/>
      <stop offset="100%" stop-color="#170319"/>
    </linearGradient>

    <!-- Neon #eb34bd Gradient -->
    <linearGradient id="pinkNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eb34bd"/>
      <stop offset="50%" stop-color="#ff70dc"/>
      <stop offset="100%" stop-color="#eb34bd"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eb34bd" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#7a1562" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#eb34bd" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .font-code { font-family: 'Fira Code', 'Courier New', Consolas, monospace; }
    .keyword { fill: #eb34bd; font-weight: 600; }
    .type { fill: #67e8f9; }
    .string { fill: #fbcfe8; }
    .property { fill: #f472b6; }
    .comment { fill: #9d5696; font-style: italic; }
    .number { fill: #facc15; }
    .punctuation { fill: #cbd5e1; }
    .linenumber { fill: #631e5f; text-anchor: end; user-select: none; }
    .highlight { fill: #ffffff; font-weight: 600; }
  </style>

  <!-- Window Container -->
  <rect x="5" y="5" width="840" height="430" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.8" />

  <!-- Outer Glow Accent Top -->
  <line x1="40" y1="5" x2="810" y2="5" stroke="#eb34bd" stroke-width="2" filter="url(#neonGlow)" stroke-opacity="0.85" />

  <!-- Window Titlebar -->
