    </text>

    <!-- Line 11 -->
    <text x="100" y="338">
      <tspan class="punctuation">};</tspan>
    </text>

    <!-- Line 12 -->
    <text x="100" y="364">
      <tspan class="keyword">while</tspan> <tspan class="punctuation">(student.isStudying &amp;&amp; student.isCoding) {</tspan>
    </text>

